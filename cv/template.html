<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8" />
<title>{{name}} — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet" />
<!-- Estilo basado en la "Plantilla CV - Harvard": serif, nombre centrado, secciones con línea inferior -->
<style>
  @page { size: Letter; margin: 0.36in 0.45in; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "STIX Two Text", "Times New Roman", Georgia, serif;
    font-size: 9.7pt;
    line-height: 1.24;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  a { color: inherit; text-decoration: none; }

  header { text-align: center; padding-bottom: 5pt; border-bottom: 1px solid #000; }
  h1 { font-size: 24pt; font-weight: 700; line-height: 1.1; }
  .title { font-size: 11pt; font-style: italic; margin-top: 1pt; }
  .contact { font-size: 9.6pt; margin-top: 3pt; }
  .sep { margin: 0 3pt; }

  .summary { font-style: italic; font-size: 10.3pt; margin-top: 6pt; text-align: justify; }

  section { margin-top: 6.5pt; }
  h2 {
    font-size: 12pt;
    font-weight: 700;
    text-transform: uppercase;
    border-bottom: 1px solid #000;
    padding-bottom: 1pt;
    margin-bottom: 4pt;
  }

  .item { margin-bottom: 5pt; break-inside: avoid; }
  .item:last-child { margin-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
  .org { font-weight: 700; font-size: 11pt; }
  .type { font-weight: 400; }
  .where { font-weight: 700; font-style: italic; white-space: nowrap; }
  .when { font-style: italic; white-space: nowrap; }

  ul { margin-top: 2pt; padding-left: 14pt; }
  li { margin-bottom: 1pt; text-align: justify; }

  .project-text { margin-top: 1pt; text-align: justify; }
  .note { font-style: italic; }

  .edu { margin-bottom: 3pt; }
  .edu .org { font-size: 10pt; }
  dl { display: grid; grid-template-columns: 128pt 1fr; row-gap: 1.5pt; column-gap: 6pt; }
  dt { font-weight: 700; }
</style>
</head>
<body>
  <header>
    <h1>{{name}}</h1>
    <div class="title">{{title}}</div>
    <div class="contact">{{contact}}</div>
  </header>

  <p class="summary">{{summary}}</p>

  <section>
    <h2>{{h_experience}}</h2>
    {{experience}}
  </section>

  <section>
    <h2>{{h_projects}}</h2>
    {{projects}}
  </section>

  <section>
    <h2>{{h_education}}</h2>
    {{education}}
  </section>

  <section>
    <h2>{{h_skills}}</h2>
    <dl>{{skills}}</dl>
  </section>
</body>
</html>
