<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="22" fill="#0b1020"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="18" font-weight="700">relay v0.1.0 · architecture</text>
  <text x="32" y="66" fill="#64748b" font-size="12">one API for Google Calendar and Outlook</text>

  <!-- client -->
  <rect x="32" y="110" width="140" height="70" rx="12" fill="#111827" stroke="#334155"/>
  <text x="102" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">Your app</text>
  <text x="102" y="160" fill="#64748b" font-size="10" text-anchor="middle">Bearer rly_live_…</text>

  <!-- api -->
  <rect x="230" y="96" width="200" height="190" rx="14" fill="#111827" stroke="#00ADD8"/>
  <text x="330" y="124" fill="#e2e8f0" font-size="13" text-anchor="middle">Relay API (Go)</text>
  <text x="330" y="150" fill="#94a3b8" font-size="10" text-anchor="middle">RequireAPIKey · hashed keys</text>
  <text x="330" y="172" fill="#94a3b8" font-size="10" text-anchor="middle">/v1/connect/{provider}</text>
  <text x="330" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">OAuth 2.0 + PKCE · 1-use state</text>
  <text x="330" y="212" fill="#94a3b8" font-size="10" text-anchor="middle">/v1/calendars/{id}/events</text>
  <text x="330" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">silent refresh · 409 on revoke</text>
  <text x="330" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">/v1/accounts</text>

  <!-- providers -->
  <rect x="500" y="110" width="268" height="60" rx="12" fill="#111827" stroke="#4285F4"/>
  <text x="634" y="135" fill="#e2e8f0" font-size="13" text-anchor="middle">Google Calendar API</text>
  <text x="634" y="155" fill="#64748b" font-size="10" text-anchor="middle">OAuth · events</text>
  <rect x="500" y="196" width="268" height="60" rx="12" fill="#111827" stroke="#00A4EF"/>
  <text x="634" y="221" fill="#e2e8f0" font-size="13" text-anchor="middle">Microsoft Graph</text>
  <text x="634" y="241" fill="#64748b" font-size="10" text-anchor="middle">Entra ID · /me · Outlook events</text>

  <!-- vault + db -->
  <rect x="230" y="340" width="200" height="74" rx="12" fill="#111827" stroke="#a855f7"/>
  <text x="330" y="370" fill="#e2e8f0" font-size="13" text-anchor="middle">Vault</text>
  <text x="330" y="390" fill="#64748b" font-size="10" text-anchor="middle">AES-256-GCM · AAD per tenant/account</text>
  <rect x="500" y="340" width="268" height="74" rx="12" fill="#111827" stroke="#336791"/>
  <text x="634" y="370" fill="#e2e8f0" font-size="13" text-anchor="middle">PostgreSQL</text>
  <text x="634" y="390" fill="#64748b" font-size="10" text-anchor="middle">tenants · accounts · tokens · oauth_states</text>
  <rect x="32" y="340" width="140" height="74" rx="12" fill="#111827" stroke="#f59e0b"/>
  <text x="102" y="370" fill="#e2e8f0" font-size="13" text-anchor="middle">Janitor</text>
  <text x="102" y="390" fill="#64748b" font-size="10" text-anchor="middle">expired states</text>

  <path d="M172 145H228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M430 140H498M430 226H498" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M330 286V338" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M430 377H498" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M172 377C200 377 200 430 400 440C560 448 600 430 634 416" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="32" y="452" width="736" height="44" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="479" fill="#64748b" font-size="11" text-anchor="middle">refresh rotation with Postgres row lock · e2e vs stateful fakes · GoReleaser · GHCR · OpenAPI 3.1</text>
</svg>
