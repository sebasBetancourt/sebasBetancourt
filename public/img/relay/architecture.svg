<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="22" fill="#0b1020"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="18" font-weight="700">relay · architecture</text>
  <text x="32" y="66" fill="#64748b" font-size="12">unified calendar &amp; mail API for Google + Microsoft</text>

  <!-- providers -->
  <rect x="32" y="110" width="150" height="56" rx="10" fill="#111827" stroke="#4285F4"/>
  <text x="107" y="135" fill="#e2e8f0" font-size="13" text-anchor="middle">Google</text>
  <text x="107" y="153" fill="#64748b" font-size="10" text-anchor="middle">Calendar · Gmail</text>
  <rect x="32" y="190" width="150" height="56" rx="10" fill="#111827" stroke="#00A4EF"/>
  <text x="107" y="215" fill="#e2e8f0" font-size="13" text-anchor="middle">Microsoft Graph</text>
  <text x="107" y="233" fill="#64748b" font-size="10" text-anchor="middle">Outlook · Entra</text>

  <!-- ingest -->
  <rect x="250" y="110" width="170" height="136" rx="12" fill="#111827" stroke="#334155"/>
  <text x="335" y="138" fill="#e2e8f0" font-size="13" text-anchor="middle">Webhook ingest</text>
  <text x="335" y="162" fill="#94a3b8" font-size="10" text-anchor="middle">signature check</text>
  <text x="335" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">idempotency key</text>
  <text x="335" y="198" fill="#94a3b8" font-size="10" text-anchor="middle">subscription renewal</text>
  <text x="335" y="216" fill="#94a3b8" font-size="10" text-anchor="middle">delta sync fallback</text>

  <!-- queue -->
  <rect x="480" y="140" width="120" height="76" rx="12" fill="#111827" stroke="#FF9900"/>
  <text x="540" y="172" fill="#e2e8f0" font-size="13" text-anchor="middle">Queue</text>
  <text x="540" y="192" fill="#64748b" font-size="10" text-anchor="middle">SQS + DLQ</text>

  <!-- workers -->
  <rect x="650" y="110" width="118" height="136" rx="12" fill="#111827" stroke="#00ADD8"/>
  <text x="709" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">Go workers</text>
  <text x="709" y="164" fill="#94a3b8" font-size="10" text-anchor="middle">sync events</text>
  <text x="709" y="182" fill="#94a3b8" font-size="10" text-anchor="middle">refresh tokens</text>
  <text x="709" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">retry + backoff</text>
  <text x="709" y="218" fill="#94a3b8" font-size="10" text-anchor="middle">outbound hooks</text>

  <!-- data -->
  <rect x="250" y="320" width="170" height="70" rx="12" fill="#111827" stroke="#336791"/>
  <text x="335" y="350" fill="#e2e8f0" font-size="13" text-anchor="middle">PostgreSQL</text>
  <text x="335" y="370" fill="#64748b" font-size="10" text-anchor="middle">tenants · events · encrypted vault</text>
  <rect x="480" y="320" width="120" height="70" rx="12" fill="#111827" stroke="#DC382D"/>
  <text x="540" y="350" fill="#e2e8f0" font-size="13" text-anchor="middle">Redis</text>
  <text x="540" y="370" fill="#64748b" font-size="10" text-anchor="middle">rate limits · locks</text>

  <!-- api -->
  <rect x="650" y="320" width="118" height="70" rx="12" fill="#111827" stroke="#a855f7"/>
  <text x="709" y="350" fill="#e2e8f0" font-size="13" text-anchor="middle">Unified API</text>
  <text x="709" y="370" fill="#64748b" font-size="10" text-anchor="middle">REST · TS SDK</text>

  <path d="M182 138H248M182 218H248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M420 178H478" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M600 178H648" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M335 246V318M709 246V318" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M680 246L560 318" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="32" y="430" width="736" height="56" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="463" fill="#64748b" font-size="11" text-anchor="middle">OAuth 2.0 + PKCE · AES-GCM envelope encryption · OpenTelemetry · Terraform on AWS</text>
</svg>
